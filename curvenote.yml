    - id: meca
      title: "MECA bundle: notebooks and environment"
  error_rules:
    - rule: link-resolves
      severity: ignore
      keys:
        - https://www.biorxiv.org/content/10.1101/2024.01.25.577295v5
  # Bundled into the MECA export, from which the BinderHub image is built.
  # Notebooks are bundled because they are in the toc.
  requirements:
    - binder/*
    - dj_local_conf.json
  resources:
    - notebook-images/*
    - notebooks/*.md
    - notebooks/py_scripts/*.py
  exports:
    - id: meca
      format: meca
  toc:
    - file: index.md
    - title: Getting Started
      children:
        - file: notebooks/00_HubQuickStart.ipynb
