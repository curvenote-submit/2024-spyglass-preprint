<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 932" width="960" height="932" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t">
<title id="t">Runs on this site</title>
<rect width="960" height="932" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="20" y="20" width="22" height="16" rx="5" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="52" y="34" font-size="18" font-weight="700" fill="#0f172a">Runs on this site</text>
<text x="20" y="58" font-size="13" fill="#475569">Run these in order on your own server, starting with the smoke test.</text>
<text x="20" y="90" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#64748b">SECTION</text>
<text x="170" y="90" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#64748b">NOTEBOOK</text>
<text x="380" y="90" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#64748b">WHAT IT DOES</text>
<line x1="20" y1="98" x2="940" y2="98" stroke="#e2e8f0"/>
<rect x="8" y="102" width="944" height="290" rx="8" fill="#f8fafc"/>
<text x="20" y="132.0" font-size="14" font-weight="700" fill="#0f172a">Getting started</text>
<rect x="170" y="108" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="132" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">00</tspan>  Smoke test</text>
<text x="380" y="132" font-size="13" fill="#334155">Checks the server: packages, database, Spyglass imports and the example recording.</text>
<rect x="170" y="166" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="190" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">01</tspan>  Concepts</text>
<text x="380" y="190" font-size="13" fill="#334155">The ideas behind Spyglass: DataJoint tables and how pipelines fit together.</text>
<rect x="170" y="224" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="248" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">02</tspan>  Insert data</text>
<text x="380" y="239" font-size="13" fill="#334155">Loads the minirec example recording into the database.</text>
<text x="380" y="257" font-size="12.5" fill="#15803d">Skips the optional 5 GB DANDI example.</text>
<rect x="170" y="282" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="306" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">04</tspan>  Merge tables</text>
<text x="380" y="297" font-size="13" fill="#334155">How merge tables collect the outputs of different pipeline versions.</text>
<text x="380" y="315" font-size="12.5" fill="#15803d">The last cell deletes the session: answer no to keep going.</text>
<rect x="170" y="340" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="364" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">05</tspan>  Export</text>
<text x="380" y="355" font-size="13" fill="#334155">Exports the subset of the database that a paper&#x27;s analysis needs.</text>
<text x="380" y="373" font-size="12.5" fill="#15803d">Skips the DANDI upload.</text>
<text x="20" y="422.0" font-size="14" font-weight="700" fill="#0f172a">Spike sorting</text>
<rect x="170" y="398" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="422" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">10</tspan>  Sorting V1</text>
<text x="380" y="413" font-size="13" fill="#334155">Detects, sorts and curates spikes with the current pipeline.</text>
<text x="380" y="431" font-size="12.5" fill="#15803d">The FigURL curation view needs a Kachery account, so it&#x27;s off.</text>
<rect x="170" y="456" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="480" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">10</tspan>  Sorting V0</text>
<text x="380" y="471" font-size="13" fill="#334155">The original spike sorting pipeline, kept for existing data.</text>
<text x="380" y="489" font-size="12.5" fill="#15803d">Runs except the last two cells (the FigURL view).</text>
<rect x="8" y="508" width="944" height="116" rx="8" fill="#f8fafc"/>
<text x="20" y="538.0" font-size="14" font-weight="700" fill="#0f172a">Position</text>
<rect x="170" y="514" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="538" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">20</tspan>  Trodes position</text>
<text x="380" y="538" font-size="13" fill="#334155">Processes the position tracking recorded by Trodes.</text>
<rect x="170" y="572" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="596" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">24</tspan>  Linearization</text>
<text x="380" y="596" font-size="13" fill="#334155">Turns 2-D position on a track into 1-D linear position.</text>
<text x="20" y="654.0" font-size="14" font-weight="700" fill="#0f172a">LFP</text>
<rect x="170" y="630" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="654" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">30</tspan>  LFP</text>
<text x="380" y="654" font-size="13" fill="#334155">Filters the raw voltage into the local field potential.</text>
<rect x="170" y="688" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="712" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">31</tspan>  Theta</text>
<text x="380" y="712" font-size="13" fill="#334155">Computes theta phase and power from the LFP.</text>
<rect x="8" y="740" width="944" height="174" rx="8" fill="#f8fafc"/>
<text x="20" y="770.0" font-size="14" font-weight="700" fill="#0f172a">Decoding</text>
<rect x="170" y="746" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="770" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">40</tspan>  Waveform features</text>
<text x="380" y="761" font-size="13" fill="#334155">Extracts spike waveform features for clusterless decoding.</text>
<text x="380" y="779" font-size="12.5" fill="#15803d">Uses 8 of the 32 tetrodes and takes about 15 minutes.</text>
<rect x="170" y="804" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="828" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">41</tspan>  Clusterless</text>
<text x="380" y="819" font-size="13" fill="#334155">Decodes position from waveform features, without spike sorting.</text>
<text x="380" y="837" font-size="12.5" fill="#15803d">Only ~10 s of position data, so results are illustrative.</text>
<rect x="170" y="862" width="186" height="38" rx="10" fill="#e7f6ee" stroke="#1f9d55" stroke-width="1.5"/>
<text x="182" y="886" font-size="14" font-weight="700" fill="#14532d"><tspan fill="#15803d">42</tspan>  Sorted spikes</text>
<text x="380" y="877" font-size="13" fill="#334155">Decodes position from sorted units.</text>
<text x="380" y="895" font-size="12.5" fill="#15803d">Illustrative only: minirec&#x27;s 3 units are labelled noise.</text>
</svg>
